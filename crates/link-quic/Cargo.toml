[package]
name = "link-quic"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
link = { path = "../link" }
serde = "1.0.229"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }
url = "2.5.8"
# ring, as egress uses: one crypto provider in the binary.
web-transport-quinn = { version = "0.13.6", default-features = false, features = ["ring"] }

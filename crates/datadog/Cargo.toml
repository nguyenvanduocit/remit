[package]
name = "datadog"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
source = { path = "../source" }
wire = { path = "../wire" }
telemetry = { path = "../telemetry" }
urlescape = { path = "../urlescape" }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "logs", "metrics", "with-serde"] }
prost = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
serde_json = { workspace = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-core = "0.1"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread"] }

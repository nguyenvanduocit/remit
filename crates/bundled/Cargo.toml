[package]
name = "bundled"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
urlescape = { path = "../urlescape" }
base64 = "0.22.1"
hex = "0.4.3"
htmlize = { version = "1.1.0", features = ["unescape"] }
jiff = "0.2.16"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
plugin-sdk = { path = "../plugin-sdk" }
procgroup = { path = "../procgroup" }
regex = "1.12.2"
reqwest = { version = "0.13.5", default-features = false }
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10.9"
source = { path = "../source" }
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "time"] }

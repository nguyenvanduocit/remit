[package]
name = "claudecode"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
childenv = { path = "../childenv" }
claudehooks = { path = "../claudehooks" }
procgroup = { path = "../procgroup" }
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "time", "macros", "fs"] }

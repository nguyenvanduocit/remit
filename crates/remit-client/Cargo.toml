[package]
name = "remit-client"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The native client of a Remit server: the owner's contract from a shell (call, snapshot, watch)"

[lints]
workspace = true

[[bin]]
name = "remit-client"
path = "src/main.rs"

[dependencies]
hex = "0.4.3"
link = { path = "../link" }
link-quic = { path = "../link-quic" }
# rustls-no-provider: the https GET of /link.json uses ring, the one crypto provider in every Remit binary.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }
wire = { path = "../wire" }

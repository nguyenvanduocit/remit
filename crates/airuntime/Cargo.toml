[package]
name = "airuntime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
agent = { path = "../agent" }
base64 = "0.22.1"
claudecode = { path = "../claudecode" }
link = { path = "../link" }
model = { path = "../model" }
regex = "1.12.2"
runtimelink = { path = "../runtimelink" }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["v4"] }
wire = { path = "../wire" }

[package]
name = "plugin-sdk"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
link = { path = "../link" }
model = { path = "../model" }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
wire = { path = "../wire" }

[package]
name = "egress"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
getrandom = "0.3.4"
http = "1.5.0"
http-body = "1.0.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["net", "rt", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "rt", "rt-multi-thread", "time", "sync", "macros", "io-util"] }

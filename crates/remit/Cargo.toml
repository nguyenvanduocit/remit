[package]
name = "remit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "remit"
path = "src/main.rs"

[dependencies]
urlescape = { path = "../urlescape" }
agent = { path = "../agent" }
airuntime = { path = "../airuntime" }
auth = { path = "../auth" }
childenv = { path = "../childenv" }
claudecode = { path = "../claudecode" }
clientmcp = { path = "../clientmcp" }
datadog = { path = "../datadog" }
door = { path = "../door" }
forge = { path = "../forge" }
jail = { path = "../jail" }
link = { path = "../link" }
link-quic = { path = "../link-quic" }
model = { path = "../model" }
openrouter = { path = "../openrouter" }
judgment = { path = "../judgment" }
orch = { path = "../orch" }
procgroup = { path = "../procgroup" }
provider = { path = "../provider" }
remit-client = { path = "../remit-client" }
rpc = { path = "../rpc" }
runtimelink = { path = "../runtimelink" }
source = { path = "../source" }
store = { path = "../store" }
telemetry = { path = "../telemetry" }
wire = { path = "../wire" }
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
flate2 = "1.1.11"
hex = "0.4.3"
jiff = "0.2.16"
mime_guess = "2.0.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
sha2 = "0.10.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
rustix = { version = "1.1.6", features = ["process"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
tar = "0.4"
time = { version = "0.3.55", features = ["local-offset", "formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "net", "io-util", "time", "fs", "sync"] }
tokio-util = "0.7.20"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "fmt", "env-filter"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time"] }

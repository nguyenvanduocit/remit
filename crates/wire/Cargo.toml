[package]
name = "wire"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
grant = { path = "../grant" }
link = { path = "../link" }
# The records the contracts carry (ADR-0107).
model = { path = "../model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The JSON Schema of the types an agent writes through a tool (a block's spec, ADR-0091), for the tool's schema.
schemars = "1.2.3"
